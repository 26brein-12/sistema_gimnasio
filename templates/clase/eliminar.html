{% extends 'gimnasio/base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Eliminar clase</h2>

    <div class="alert alert-warning">
        ¿Estás seguro de que deseas eliminar la clase
        <strong>{{ clase.nombre }}</strong>?
    </div>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Sí, eliminar
        </button>

        <a href="{% url 'clase:lista_clases' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>

</div>

{% endblock %}
