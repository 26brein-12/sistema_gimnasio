{% extends 'gimnasio/base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Eliminar inscripción</h2>

    <div class="alert alert-warning">
        ¿Estás seguro de que deseas eliminar esta inscripción?

        <p class="mt-2">
            <strong>Socio:</strong> {{ inscripcion.socio }}
        </p>

        <p>
            <strong>Clase:</strong> {{ inscripcion.clase }}
        </p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Sí, eliminar
        </button>

        <a href="{% url 'inscripcion:lista_inscripciones' %}"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
