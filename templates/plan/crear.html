
{% extends 'gimnasio/base.html' %}

{% block content %}

<div class="container">
    <h2 class="mb-4">Registrar nuevo plan</h2>

    <div class="card shadow">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Nombre del plan</label>
                    <input type="text" name="nombre_plan"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion"
                              class="form-control" rows="3"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input type="number" name="precio"
                           class="form-control" step="0.01"
                           min="0" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Duración en días</label>
                    <input type="number" name="duracion_dias"
                           class="form-control" min="1" required>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" name="activo"
                           class="form-check-input" checked>
                    <label class="form-check-label">
                        Plan activo
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar plan
                </button>

                <a href="{% url 'plan:lista_planes' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>
            </form>

        </div>
    </div>
</div>

{% endblock %}
